name: GeoTraceLab
options:
  bundleIdPrefix: com.geotrace
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal

packages:
  LiveTracking:
    path: ../LiveTracking

targets:
  GeoTraceLab:
    type: application
    platform: iOS
    dependencies:
      - package: LiveTracking
        product: LiveTracking
    sources:
      - path: Sources
      - path: Resources/spb.geograph
        type: file
        buildPhase: resources
      - path: Resources/spb-graph-metadata.json
        type: file
        buildPhase: resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: GeoTraceLab
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - location
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSLocationWhenInUseUsageDescription: >-
          GeoTraceLab records your GPS track while you drive so the route can be
          reconstructed afterwards. Recording only runs while a trip is active.
        NSLocationAlwaysAndWhenInUseUsageDescription: >-
          GeoTraceLab keeps recording the route while the app is in the
          background so a trip is not lost when the screen locks.
        NSMotionUsageDescription: >-
          GeoTraceLab records accelerometer and gyroscope data so the route can
          be reconstructed when GPS drops out.
        NSCameraUsageDescription: >-
          After you stop, GeoTraceLab can photograph a street sign or building
          number to help identify where the car was parked.
        NSPhotoLibraryUsageDescription: >-
          Used to pick an existing photo of the parking location when the camera
          is not available.
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.geotrace.GeoTraceLab

  GeoTraceLabTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/GeoTraceLabTests
    dependencies:
      - target: GeoTraceLab
      - package: LiveTracking
        product: LiveTracking
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.geotrace.GeoTraceLabTests

schemes:
  GeoTraceLab:
    build:
      targets:
        GeoTraceLab: all
        GeoTraceLabTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GeoTraceLabTests
